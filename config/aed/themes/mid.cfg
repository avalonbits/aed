# For the mid-brightness backgrounds, where neither dark.cfg nor light.cfg
# reads well. See dark.cfg for what a theme may and may not change.

[theme]
name   = mid
covers = 2 8 9 10 12 13

[colours]
comment  = 0
string   = 15
number   = 13
keyword  = 15
type     = 11
preproc  = 9
label    = 12
operator = 0
