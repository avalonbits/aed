# For dark backgrounds.
#
# A theme names the backgrounds its author designed it against, and AED picks
# the first one that covers the background in force. A colour that reads well
# on black is unreadable on white, so there is no one theme.
#
# Neither fg nor bg is set here, which is deliberate: this theme colours tokens
# and leaves the pair the user chose exactly where it is. A theme that wants
# its own pair says so with `fg` and `bg`, and even then it moves only the
# active pair -- what is written to aed.cfg is what the user picked, and
# opening a file with no grammar puts it back.
#
# A class left out is a class this theme says nothing about, and text in it
# stays the document's own colour. `text` is left out on purpose.

[theme]
name   = dark
covers = 0 1 4 5

[colours]
comment  = 8     ; grey, so it sits behind the code
string   = 10
number   = 13
keyword  = 14
type     = 11
preproc  = 9
label    = 12
operator = 7
