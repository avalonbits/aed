# MOS command scripts: an obey file, and autoexec.txt, which MOS runs at boot.
#
# From the command line reference at agonplatform.github.io/agon-docs, MOS 3.
# One command a line, and the language is the command set: what a line says is
# which command it runs, so the commands are what gets coloured.

[syntax]
name       = MOS Obey
# autoexec.txt by its whole name. Claiming .txt would colour every text file
# on the card as a script.
extensions = .obey autoexec.txt
# MOS matches command names without case: CAT, cat and Cat are one command.
case       = insensitive

[match]
# A line that starts with `#`, or with `|` and a space, is skipped. That is
# the whole comment syntax: a `#` later in a line is an argument.
comment.line         = bol '#'
comment.line         = bol '| '

# Quoting is how an argument keeps its spaces. `|` introduces a GSTrans
# control code, and `|"` is a quote inside a string.
string.quoted.double = span '"' '"' escape |

# A system variable, expanded where it is written: <Obey$Dir>, <Sys$Time>.
# Echo's <65> is a character code in the same brackets.
entity.name.variable = span '<' '>'

keyword.control      = words if ifthere then else try

# Every built-in command, aliases included. Coloured wherever it appears,
# because If, IfThere and Try all run a command later on the line.
support.function     = words cat cd cdir cls copy cp credits delete dir do echo erase exec help hotkey jmp load loadfile ls mem mkdir mount move mv obey printf rename rm run runbin runfile save set seteval setmacro show time type unset vdu

# Decimal, and &FF for hexadecimal. %0 to %9, an obey file's arguments, come
# out in the same colour: MOS substitutes them for what was passed.
constant.numeric     = number
