# C, and enough of C++ to read a header.
#
# Rules are tried in order and the first to match at a position wins. The
# comment and string rules come first because everything else -- a keyword, a
# number, a preprocessor line -- is ordinary text once it is inside one.
#
# Scope names are TextMate's. AED collapses them onto its own classes by their
# first component, which is what lets a theme colour them without knowing every
# scope, and what a converter from a real .sublime-syntax would produce.

[syntax]
name       = C
extensions = .c .h .cc .cpp .hpp .hh .cxx .hxx

[match]
# To the end of the line, whatever is in it.
comment.line                 = eol '//'

# The one rule in any of AED's grammars that runs past a line end. `multiline`
# is what says so, and it is what makes the lexer carry a state from each row
# to the one below it while a screen is painted.
comment.block                = span '/*' '*/' multiline

# Strings close at the line end even when they are unterminated, so one stray
# quote colours one line rather than the rest of the file. A line continuation
# inside a string literal is rare enough to be worth that trade.
string.quoted.double         = span '"' '"' escape \
string.quoted.single         = span "'" "'" escape \

# A directive is its whole line, the header name in an #include with it. That
# is coarse, and it is what makes the common case -- a run of #includes at the
# top of a file -- read as one block instead of flickering between classes.
keyword.control.preprocessor = bol '#'

keyword.control              = words if else for while do switch case default break continue return goto sizeof

storage.type                 = words auto bool char class const double enum extern float inline int long namespace register restrict short signed static struct template typedef union unsigned void volatile size_t ssize_t ptrdiff_t intptr_t uintptr_t int8_t int16_t int32_t int64_t uint8_t uint16_t uint32_t uint64_t

constant.numeric             = number
