# INI files: AED's settings, and the grammars and themes beside them.

[syntax]
name       = INI
extensions = .ini .cfg

[match]
comment.line               = eol '#'
comment.line               = eol ';'

# A heading and a name land on different classes on purpose, so a section
# stands out from the settings inside it.
entity.name.section        = span '[' ']'
support.type.property-name = label

string.quoted.double       = span '"' '"' escape \

constant.numeric           = number
