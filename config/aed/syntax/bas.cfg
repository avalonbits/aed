# BBC BASIC, as Agon runs it.
#
# Rules are tried in order and the first to match at a position wins.
#
# Scope names are TextMate's. AED collapses them onto its own classes by their
# first component, which is what lets a theme colour them without knowing every
# scope, and what a converter from a real .sublime-syntax would produce.

[syntax]
name       = BBC BASIC
extensions = .bas .bbc
# PRINT and print are the same statement, and both get typed.
case       = insensitive
# `MID$` and `A%` end in characters that are punctuation in C and a number
# prefix in assembly, so BASIC has to say they are part of a word. Without this
# a word rule could not name `MID$` at all.
wordchars  = $%

[match]
# REM runs to the end of the line. It is a word, so REMOVE is a variable and
# not the start of a comment -- the lexer checks the boundary because this
# literal is made of word characters.
comment.line         = eol 'REM'

# No escape character: BBC BASIC has none, and a quote inside a string is
# written by doubling it, which closes and reopens rather than escaping.
string.quoted.double = span '"' '"'

keyword.control      = words IF THEN ELSE ENDIF FOR TO STEP NEXT REPEAT UNTIL WHILE ENDWHILE CASE OF WHEN OTHERWISE ENDCASE GOTO GOSUB RETURN DEF PROC FN ENDPROC LOCAL ON ERROR STOP END RUN NEW LIST RENUMBER TRACE DIM LET INPUT PRINT READ DATA RESTORE CLS CLG MODE COLOUR GCOL PLOT DRAW MOVE VDU SOUND ENVELOPE WAIT CALL CHAIN CLEAR CLOSE OSCLI REPORT SWAP TAB SPC WIDTH LINE

# AND and MOD are operators spelled as words, which is what separates them from
# the statements above.
punctuation.operator = words AND OR NOT EOR MOD DIV

support.function     = words ABS ACS ASC ASN ATN BGET BPUT CHR$ COS COUNT DEG EOF ERL ERR EVAL EXP EXT FALSE GET GET$ HIMEM INKEY INKEY$ INSTR INT LEFT$ LEN LN LOG LOMEM MID$ OPENIN OPENOUT OPENUP PAGE PI POINT POS PTR RAD RIGHT$ RND SGN SIN SQR STR$ STRING$ SUM TAN TIME TRUE USR VAL VPOS

# `&FF` is BASIC's hex, and `10.5` its float; both are the number rule's.
constant.numeric     = number
