# eZ80 assembly.
#
# Rules are tried in order and the first to match at a position wins, so the
# comment marker comes before anything that could appear inside a comment.
#
# Scope names are TextMate's. AED collapses them onto its own classes by their
# first component, which is what lets a theme colour them without knowing every
# scope, and what a converter from a real .sublime-syntax would produce.

[syntax]
name       = eZ80 assembly
extensions = .s .asm .inc .z80
# ld and LD are the same instruction, and both are written.
case       = insensitive

[match]
# Everything after a semicolon, whatever it looks like.
comment.line                 = eol ';'

string.quoted.double         = span '"' '"' escape \
string.quoted.single         = span "'" "'" escape \

# A name in the first column. Assembly puts labels there and nothing else.
entity.name.label            = label

# Directives before opcodes: both are words, and a directive starting with a
# dot cannot be an opcode, but `rst.lil` shows the dot is not enough on its own.
keyword.control.preprocessor = words .assume .org .align .db .dw .dl .ds .equ .include .incbin .macro .endmacro .if .else .endif .end .text .data .bss .global .extern .fill .blkb

keyword.control              = words adc add and bit call ccf cp cpd cpdr cpi cpir cpl daa dec di djnz ei ex exx halt im in inc ind indr ini inir jp jr ld ldd lddr ldi ldir mlt neg nop or otdr otir out outd outi pea pop push res ret reti retn rl rla rlc rlca rld rr rra rrc rrca rrd rst rst.lil rst.lis sbc scf set sla slp sra srl sub tst tstio xor

storage.register             = words a b c d e h l i r af af' bc de hl ix iy sp pc ixh ixl iyh iyl mb

constant.numeric             = number
